    - data:
        code: "import re\n\ndef main(report_text: str) -> dict:\n    text = re.sub(r\"\\s+\", \" \", report_text or \"\").strip()\n\
          \    valid_chars = len(re.findall(r\"[\\u4e00-\\u9fffA-Za-z0-9]\", text))\n    number_count = len(re.findall(r\"\
          (?<![A-Za-z])[-+]?\\d+(?:\\.\\d+)?(?:[eE][-+]?\\d+)?\", text))\n    signals = []\n    checks = [\n        (\"实验目的\"\
          , r\"实验目的|试验目的\"),\n        (\"实验原理\", r\"实验原理|试验原理|理论依据\"),\n        (\"实验步骤\", r\"实验步骤|试验步骤|操作步骤|实验过程\"),\n  \
          \      (\"数据处理\", r\"数据处理|计算结果|实验数据|试验数据\"),\n        (\"曲线或图表\", r\"曲线|图\\s*\\d+|表\\s*\\d+|应力.?应变|力.?位移\"),\n \
          \       (\"误差分析\", r\"误差|偏差|不确定度\"),\n        (\"结论\", r\"实验结论|试验结论|结论\"),\n        (\"总结反思\", r\"总结|反思|心得|改进\"\
          ),\n    ]\n    for name, pattern in checks:\n        if re.search(pattern, text, re.I):\n            signals.append(name)\n\
          \    level = \"空或几乎无有效正文\" if valid_chars < 80 else (\"有效内容较少\" if valid_chars < 250 else \"正文可进入完整评阅\")\n    summary\
          \ = f\"有效字符约{valid_chars}；可识别数值约{number_count}处；章节或证据线索：{('、'.join(signals) if signals else '未识别')}；预检结论：{level}。\"\
          \n    return {\"valid_chars\": valid_chars, \"number_count\": number_count, \"quality_summary\": summary}\n"
        code_language: python3
        desc: 统计有效内容与证据线索，不截断报告
        outputs:
          valid_chars:
            children: null
            type: number
          number_count:
            children: null
            type: number
          quality_summary:
            children: null
            type: string
        selected: false
        title: 报告内容预检
        type: code
        variables:
