    - data:
        code: "import json\nimport re\n\ndef parse_result(text, maximum, label):\n    source = (text or \"\").strip()\n  \
          \  match = re.search(r\"\\{[\\s\\S]*\\}\", source)\n    try:\n        data = json.loads(match.group(0) if match\
          \ else source)\n    except Exception:\n        return {\"score\": 0.0, \"comment\": f\"{label}的自动评阅结果无法解析，需教师人工复核。\"\
          }\n    try:\n        score = float(data.get(\"score\", 0))\n    except Exception:\n        score = 0.0\n    score\
          \ = round(max(0.0, min(float(maximum), score)), 1)\n    comment = str(data.get(\"comment\") or \"未生成分项意见，需教师复核。\"\
          ).strip()\n    return {\"score\": score, \"comment\": comment}\n\ndef main(process_text: str, data_text: str, analysis_text:\
          \ str, reflection_text: str, valid_chars: float) -> dict:\n    parts = [\n        (\"实验原理与过程\", 20, parse_result(process_text,\
          \ 20, \"实验原理与过程\")),\n        (\"数据处理与实验结果\", 35, parse_result(data_text, 35, \"数据处理与实验结果\")),\n        (\"分析、误差与结论\"\
          , 30, parse_result(analysis_text, 30, \"分析、误差与结论\")),\n        (\"规范性与个人反思\", 15, parse_result(reflection_text,\
          \ 15, \"规范性与个人反思\")),\n    ]\n    total = round(sum(item[2][\"score\"] for item in parts), 1)\n    chars = int(valid_chars\
          \ or 0)\n    cap_note = \"\"\n    cap = 100.0\n    if chars < 80:\n        cap, cap_note = 15.0, \"报告几乎没有可评阅正文，总分按空报告规则控制在15分以内。\"\
          \n    elif chars < 250:\n        cap, cap_note = 40.0, \"报告有效内容较少，总分按内容不足规则控制在40分以内。\"\n    if total > cap and total\
          \ > 0:\n        ratio = cap / total\n        for _, _, result in parts:\n            result[\"score\"] = round(result[\"\
          score\"] * ratio, 1)\n        total = round(sum(item[2][\"score\"] for item in parts), 1)\n        if total > cap:\n\
          \            total = cap\n    lines = [f\"{name}（{result['score']}/{maximum}）：{result['comment']}\" for name, maximum,\
          \ result in parts]\n    if cap_note:\n        lines.append(cap_note)\n    lines.append(\"以上结果为AI分项评阅建议，教师可结合报告原文件中的图表和公式进行最终确认。\"\
          )\n    return {\"score\": total, \"comment\": \"\\n\".join(lines)}\n"
        code_language: python3
        desc: 解析四项结果、确定性求和并执行空报告防高分规则
        outputs:
          score:
            children: null
            type: number
          comment:
            children: null
            type: string
        selected: false
        title: 汇总评分与评语
