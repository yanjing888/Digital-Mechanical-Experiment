# 万测 TestPilot 生成的 MDB 文件所在目录。Windows 路径可直接使用反斜杠。
# 相对路径以启动后端时的工作目录为基准。修改后下次点击“自动采集”立即生效。
data.dir=D:\yanjing\01 北方工业大学土木力学实验室数字化升级项目\data

# 单机兼容模式；集中部署时请启用下面的 station.ids，不能让各实验台共用同一目录。
